[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhl-research"
version = "0.1.0"
description = "Point-in-time NHL forecasting and paper-trading research platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nhl-model research" }]
dependencies = [
  "pandas>=2.0.0,<4",
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
  "pyarrow>=14.0.0",
  "duckdb>=1.0.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
advanced = ["xgboost>=2.0.0"]

[project.scripts]
nhl-research = "nhl_research.cli:main"

[tool.setuptools.packages.find]
include = ["nhl_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "acceptance: end-to-end acceptance safeguards",
  "slow: longer real-data smoke tests",
]
